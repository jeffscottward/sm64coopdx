<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>SM64CoopDX — Web</title>
  <!--
    COOP/COEP headers (required if using SharedArrayBuffer for pthreads):

    The web server MUST send these HTTP headers for SharedArrayBuffer to be
    available. If using python3 -m http.server for local testing, you will
    need a wrapper that injects these headers.

      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp

    Without these headers, SharedArrayBuffer is undefined and any pthread
    features will fail at runtime.
  -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #canvas {
      display: none;
      border: none;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ROM upload overlay — visible before the game starts */
    #rom-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 32px;
    }

    #rom-overlay h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #rom-overlay p {
      color: #999;
      font-size: 0.95rem;
      max-width: 420px;
      line-height: 1.5;
    }

    #rom-upload-btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #e03030;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #rom-upload-btn:hover {
      background: #c02020;
    }

    #rom-upload-btn:active {
      background: #a01818;
    }

    /* Loading overlay — shown while WASM boots and assets extract */
    #loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 32px;
    }

    #loading-text {
      font-size: 1rem;
      color: #ccc;
    }

    #progress-bar-outer {
      width: 320px;
      max-width: 80vw;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }

    #progress-bar-inner {
      width: 0%;
      height: 100%;
      background: #e03030;
      border-radius: 6px;
      transition: width 0.2s;
    }

    /* Error display */
    #error-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 32px;
    }

    #error-overlay p {
      color: #f66;
      font-size: 0.95rem;
      max-width: 600px;
      line-height: 1.6;
      text-align: left;
    }

    #error-overlay p strong {
      font-size: 1.1rem;
      color: #ff8888;
    }

    #error-overlay p small {
      font-style: italic;
    }

    /* Audio hint — shown when AudioContext is suspended */
    #audio-hint {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 1000;
      pointer-events: none;
      animation: audio-hint-pulse 2s ease-in-out infinite;
    }

    @keyframes audio-hint-pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- ROM upload screen (visible initially) -->
    <div id="rom-overlay">
      <h1>SM64CoopDX</h1>
      <p>
        This is an unofficial web port. You must provide your own
        <strong>Super Mario 64</strong> US ROM file
        (<code>.z64</code> / <code>.n64</code> / <code>.v64</code>).
      </p>
      <button id="rom-upload-btn">Select ROM File</button>
      <p><small>Your ROM is processed locally and never uploaded to any server.</small></p>
    </div>

    <!-- Loading indicator (shown while WASM loads) -->
    <div id="loading-overlay">
      <h1>SM64CoopDX</h1>
      <div id="loading-text">Loading...</div>
      <div id="progress-bar-outer">
        <div id="progress-bar-inner"></div>
      </div>
    </div>

    <!-- Error display -->
    <div id="error-overlay">
      <h1>SM64CoopDX</h1>
      <p id="error-text">An error occurred.</p>
      <button id="rom-upload-btn-retry" onclick="location.reload()">Reload</button>
    </div>

    <!-- Game canvas (hidden until the game engine initializes it) -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Audio hint — shown after game starts if AudioContext is still suspended -->
    <div id="audio-hint">Click or press any key to enable audio</div>
  </div>

  <script>
    /**
     * Emscripten Module configuration.
     *
     * This object is read by the Emscripten-generated JS glue code. It must
     * be defined BEFORE the glue script ({{{ SCRIPT }}} below) is loaded.
     */
    var Module = {
      /* Target the canvas element for WebGL rendering */
      canvas: (function() {
        var c = document.getElementById('canvas');
        c.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost. Please reload the page.');
          e.preventDefault();
        }, false);
        return c;
      })(),

      /**
       * setStatus — called by Emscripten to report loading progress.
       *
       * The status string format is either:
       *   "Downloading data... (X/Y)"  — with byte counts
       *   "Some status message"        — without progress numbers
       *   ""                           — done
       */
      setStatus: function(text) {
        var loadingOverlay = document.getElementById('loading-overlay');
        var loadingText = document.getElementById('loading-text');
        var progressBar = document.getElementById('progress-bar-inner');

        if (!text) {
          /* Empty string = loading complete */
          loadingOverlay.style.display = 'none';
          return;
        }

        /* Show loading overlay if not already visible */
        var romOverlay = document.getElementById('rom-overlay');
        if (romOverlay.style.display !== 'none') {
          romOverlay.style.display = 'none';
          loadingOverlay.style.display = 'flex';
        }

        loadingText.textContent = text;

        /* Parse progress from "Downloading data... (X/Y)" format */
        var m = text.match(/\((\d+(?:\.\d+)?)\/?(\d+(?:\.\d+)?)\)/);
        if (m) {
          var current = parseFloat(m[1]);
          var total = parseFloat(m[2]);
          if (total > 0) {
            progressBar.style.width = ((current / total) * 100).toFixed(1) + '%';
          }
        }
      },

      /**
       * onRuntimeInitialized — called once the WASM module is ready.
       *
       * At this point, the game's main() is about to be called. The ROM
       * file picker (triggered from C via EM_ASM) will appear if needed.
       * We hide the loading overlay and show the canvas.
       */
      onRuntimeInitialized: function() {
        document.getElementById('loading-overlay').style.display = 'none';
        var canvas = document.getElementById('canvas');
        canvas.style.display = 'block';

        /* Size the canvas to fill the viewport */
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /* Give the canvas keyboard focus so SDL receives key events.
         * tabindex="-1" allows programmatic focus but prevents Tab-key
         * navigation to the canvas during the ROM upload flow. */
        canvas.focus();
        console.log('[Web Input] Canvas focused for keyboard events');

        /* Re-focus the canvas on click — in case the user clicks outside
         * and then back on the canvas, or after browser UI steals focus. */
        canvas.addEventListener('click', function() {
          canvas.focus();
        });

        /* Release all keys when the window/tab loses focus.
         * Without this, keys held during a tab switch stay "stuck" because
         * the keyup events fire while the tab is not focused. Emscripten's
         * SDL2 port may not relay visibilitychange to SDL_WINDOWEVENT_FOCUS_LOST
         * reliably, so we handle it from JavaScript. */
        document.addEventListener('visibilitychange', function() {
          if (document.hidden && Module._keyboard_on_all_keys_up) {
            Module._keyboard_on_all_keys_up();
            console.log('[Web Input] Tab hidden — released all keys');
          }
        });
        window.addEventListener('blur', function() {
          if (Module._keyboard_on_all_keys_up) {
            Module._keyboard_on_all_keys_up();
            console.log('[Web Input] Window blurred — released all keys');
          }
        });

        /* Pointer lock note:
         * SDL_SetRelativeMouseMode(SDL_TRUE) in Emscripten's SDL2 port maps
         * to requestPointerLock(). The port internally defers the request
         * until the next user click event, which satisfies the browser's
         * user-gesture requirement. No additional JS-side pointer lock
         * management is needed — SDL handles the click-to-lock flow.
         *
         * The game's controller_sdl_read() calls enter_relative/leave_relative
         * based on camera mode, pause state, and DJUI state. SDL's deferred
         * pointer lock will activate on the user's next click after the game
         * requests it. */

        /* Log pointer lock state changes for debugging */
        document.addEventListener('pointerlockchange', function() {
          if (document.pointerLockElement === canvas) {
            console.log('[Web Input] Pointer lock acquired');
          } else {
            console.log('[Web Input] Pointer lock released');
          }
        });

        /* Prevent browser default key actions that interfere with gameplay.
         * Arrow keys and Space scroll the page, Tab changes focus, Backspace
         * navigates back. These must be suppressed when the canvas has focus
         * so the game receives the events cleanly via SDL's event loop. */
        var gameKeys = {
          'ArrowUp': true, 'ArrowDown': true, 'ArrowLeft': true, 'ArrowRight': true,
          'Space': true, 'Tab': true, 'Backspace': true,
          'F1': true, 'F2': true, 'F3': true, 'F4': true, 'F5': true
        };
        window.addEventListener('keydown', function(e) {
          if (document.activeElement === canvas && gameKeys[e.code]) {
            e.preventDefault();
          }
        });

        /* Show audio hint if AudioContext is suspended (autoplay policy).
         * The hint is hidden by audio_web.h's _sm64_onInteraction handler
         * or by the poll below once audio starts running. */
        setTimeout(function checkAudioHint() {
          var ctx = null;
          if (typeof SDL2 !== 'undefined' && SDL2.audioContext) {
            ctx = SDL2.audioContext;
          } else if (typeof Module !== 'undefined' && Module.SDL2 && Module.SDL2.audioContext) {
            ctx = Module.SDL2.audioContext;
          }
          var hint = document.getElementById('audio-hint');
          if (ctx && ctx.state === 'suspended') {
            hint.style.display = 'block';
            /* Poll until audio starts */
            var poll = setInterval(function() {
              if (!ctx || ctx.state !== 'suspended') {
                hint.style.display = 'none';
                clearInterval(poll);
              }
            }, 500);
          }
        }, 1000);
      },

      /* Print stdout to browser console */
      print: function(text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(' ');
        }
        console.log(text);
      },

      /* Print stderr to browser console as warnings */
      printErr: function(text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(' ');
        }
        console.warn(text);
      }
    };

    /* When status is set before the overlays exist, queue it */
    Module.setStatus('Downloading...');

    /**
     * WASM crash diagnostics — translates common RuntimeError messages
     * into user-friendly descriptions with debugging hints.
     */
    function classifyCrashError(message, error) {
      var msg = String(message || '');
      var stack = (error && error.stack) ? error.stack : '';

      if (msg.indexOf('memory access out of bounds') !== -1) {
        return {
          title: 'Memory Access Error',
          detail: 'The game attempted to read or write memory outside its allocated bounds. ' +
                  'This is typically caused by a null pointer dereference, buffer overflow, or ' +
                  'insufficient WASM memory.',
          hint: 'Try rebuilding with WEB_DEBUG=1 for more details, or increase INITIAL_MEMORY in Makefile.web.'
        };
      }
      if (msg.indexOf('unreachable') !== -1) {
        return {
          title: 'Assertion Failure (unreachable)',
          detail: 'The game hit an abort() or assertion failure. This means a condition the ' +
                  'code expected to be true was violated.',
          hint: 'Rebuild with WEB_DEBUG=1 (enables ASSERTIONS=2) to see the exact assertion message.'
        };
      }
      if (msg.indexOf('table index is out of bounds') !== -1 ||
          msg.indexOf('null function') !== -1 ||
          msg.indexOf('indirect call') !== -1) {
        return {
          title: 'Function Pointer Error',
          detail: 'The game tried to call a function through an invalid pointer. This can ' +
                  'happen with corrupted vtables or bad function pointer casts.',
          hint: 'Check for uninitialized function pointers or ABI mismatches in native code.'
        };
      }
      if (msg.indexOf('out of memory') !== -1 || msg.indexOf('OOM') !== -1 ||
          msg.indexOf('Cannot enlarge memory') !== -1) {
        return {
          title: 'Out of Memory',
          detail: 'The game exhausted available WebAssembly memory. The browser could not ' +
                  'allocate more memory for the game.',
          hint: 'Increase INITIAL_MEMORY in Makefile.web (currently 512MB). Some browsers limit ' +
                'WASM memory to ~2GB on 32-bit or ~4GB on 64-bit.'
        };
      }
      if (msg.indexOf('stack overflow') !== -1 || msg.indexOf('call stack') !== -1) {
        return {
          title: 'Stack Overflow',
          detail: 'The game exceeded its stack size, likely from deep or infinite recursion.',
          hint: 'Increase STACK_SIZE in Makefile.web (currently 1MB) or investigate recursive calls.'
        };
      }
      return {
        title: 'Runtime Error',
        detail: msg,
        hint: 'Check the browser DevTools console (F12) for the full error stack trace.'
      };
    }

    function showCrashScreen(message, error) {
      var loadingOverlay = document.getElementById('loading-overlay');
      var errorOverlay = document.getElementById('error-overlay');
      var errorText = document.getElementById('error-text');

      loadingOverlay.style.display = 'none';
      document.getElementById('rom-overlay').style.display = 'none';
      document.getElementById('canvas').style.display = 'none';
      document.getElementById('audio-hint').style.display = 'none';
      errorOverlay.style.display = 'flex';

      var info = classifyCrashError(message, error);
      errorText.innerHTML = '<strong>' + info.title + '</strong><br><br>' +
                            info.detail + '<br><br>' +
                            '<small style="color:#aaa">' + info.hint + '</small>';

      /* Log full details to console for developers */
      console.error('[SM64CoopDX Crash]', info.title);
      console.error('[SM64CoopDX Crash] Detail:', info.detail);
      console.error('[SM64CoopDX Crash] Raw message:', message);
      if (error && error.stack) {
        console.error('[SM64CoopDX Crash] Stack trace:', error.stack);
      }
    }

    /* Handle uncaught errors (synchronous throws, WASM traps) */
    window.onerror = function(message, url, line, col, error) {
      showCrashScreen(message, error);
    };

    /* Handle unhandled promise rejections (async errors from Emscripten) */
    window.addEventListener('unhandledrejection', function(event) {
      var error = event.reason;
      var message = (error && error.message) ? error.message : String(error);
      showCrashScreen(message, error);
    });
  </script>

  <!--
    Emscripten glue code.
    The {{{ SCRIPT }}} placeholder is replaced by Emscripten's linker with the
    appropriate <script> tag pointing to the generated .js file.
  -->
  {{{ SCRIPT }}}
</body>
</html>
